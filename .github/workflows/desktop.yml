name: Desktop packaging source checks

on:
  pull_request:
    branches: [main]
    paths:
      - "linux/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".gitmodules"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    paths:
      - "linux/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".gitmodules"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rpm-source:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install validation tools
        run: dnf -y install git patch python3 rpm-build pyproject-rpm-macros systemd-rpm-macros firewalld-filesystem

      - name: Checkout pinned sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate native RPM sources
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C external/sunshine config --global --add safe.directory "$GITHUB_WORKSPACE/external/sunshine"
          bash -n packaging/rpm/build.sh packaging/tumbleweed/build.sh
          python3 - <<'PYTHON'
          from pathlib import Path
          import re
          import subprocess
          import tomllib

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          sunshine = subprocess.check_output(
              ["git", "-C", "external/sunshine", "rev-parse", "HEAD"], text=True
          ).strip()
          for name in ("rpm", "tumbleweed"):
              spec = Path(f"packaging/{name}/monitorize.spec").read_text()
              assert re.search(rf"(?m)^Version:\s+{re.escape(version)}$", spec)
              assert re.search(rf"(?m)^%global sunshine_commit {sunshine}$", spec)
              assert "-DCUDA_FAIL_ON_MISSING=ON" in spec
              assert "-DSUNSHINE_ENABLE_CUDA=ON" in spec
          PYTHON
          git -C external/sunshine apply --check ../../packaging/sunshine-strict-selection.patch
          rpmspec -P packaging/rpm/monitorize.spec >/dev/null
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=linux python3 -m unittest \
            linux.tests.test_tumbleweed_rpm \
            linux.tests.test_installer.SunshineOnlyPackagingTest.test_forced_codec_participates_in_moonlight_negotiation -q
